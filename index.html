<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark light" />
  <title>Daily Crypto Reports</title>
  <meta name="description" content="Daily crypto market intelligence reports." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
  <!-- Markdown renderer + sanitizer (pinned versions, loaded from CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="back-btn" hidden aria-label="Back to list">‹ Reports</button>
    <h1 id="title" class="topbar-title">📈 Daily Crypto Reports</h1>
    <span id="count" class="count"></span>
  </header>

  <main id="main">
    <!-- List view -->
    <section id="listView" class="list-view">
      <div id="reportList" class="report-list" aria-live="polite"></div>
    </section>

    <!-- Report view -->
    <article id="reportView" class="report-view markdown-body" hidden></article>

    <div id="status" class="status"></div>
  </main>

  <footer class="footer">
    <span>Auto-published daily · <a id="repoLink" href="#" rel="noopener">source</a></span>
  </footer>
</body>
</html>
