<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark light" />
  <title>Daily Crypto Reports</title>
  <meta name="description" content="Daily crypto market intelligence reports." />

  <!-- Add to Home Screen / PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Crypto Reports" />
  <link rel="icon" type="image/png" href="./icon-512.png" />
  <link rel="apple-touch-icon" href="./icon-512.png" />

  <link rel="stylesheet" href="./style.css" />
  <!-- Markdown renderer + sanitizer (vendored locally — no runtime CDN dependency) -->
  <script src="./vendor/marked.min.js" defer></script>
  <script src="./vendor/purify.min.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="back-btn" hidden aria-label="Back to list">‹ Reports</button>
    <h1 id="title" class="topbar-title">📈 Daily Crypto Reports</h1>
    <span id="count" class="count"></span>
  </header>

  <main id="main">
    <!-- List view -->
    <section id="listView" class="list-view">
      <div id="freshness" class="freshness" hidden></div>
      <div id="reportList" class="report-list" aria-live="polite"></div>
    </section>

    <!-- Report view -->
    <article id="reportView" class="report-view markdown-body" hidden></article>

    <div id="status" class="status"></div>
  </main>

  <footer class="footer">
    <span>Auto-published daily · <a id="repoLink" href="#" rel="noopener">source</a></span>
  </footer>
</body>
</html>
